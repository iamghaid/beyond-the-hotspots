<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Weighted absolute error against observed VIIRS, by season</title>
<desc id="d">Raw MODIS error stays between 37 and 54 percent in every season. Harmonized MODIS error is 4 to 21 percent. Seasons 2013 to 2016 were used to fit the model.</desc>
<defs><pattern id="h" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#d0d7de" stroke-width="2"/></pattern></defs>
<rect width="760" height="300" fill="#ffffff"/>
<text x="46" y="22" font-size="15" font-weight="700" fill="#1f2328">Error against observed VIIRS, by season</text>
<text x="46" y="42" font-size="12" fill="#57606a">Seasons outside fitting: raw MODIS 44.48% → harmonized 9.94% (120 months). Hatched = seasons used to fit.</text>
<line x1="46" x2="744" y1="260.0" y2="260.0" stroke="#eaeef2"/><text x="40" y="264.0" font-size="11" fill="#57606a" text-anchor="end">0%</text>
<line x1="46" x2="744" y1="192.7" y2="192.7" stroke="#eaeef2"/><text x="40" y="196.7" font-size="11" fill="#57606a" text-anchor="end">20%</text>
<line x1="46" x2="744" y1="125.3" y2="125.3" stroke="#eaeef2"/><text x="40" y="129.3" font-size="11" fill="#57606a" text-anchor="end">40%</text>
<line x1="46" x2="744" y1="58.0" y2="58.0" stroke="#eaeef2"/><text x="40" y="62.0" font-size="11" fill="#57606a" text-anchor="end">60%</text>
